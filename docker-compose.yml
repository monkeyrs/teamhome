services:
  api:
    build: .
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://admin:admin@db:5432/teamhome}
      LANGGRAPH_API_URL: http://langgraph:22024
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamhome}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    restart: unless-stopped
    ports:
      - "5432:5432"

  langgraph:
    build: .
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://admin:admin@db:5432/teamhome}
    command: ["langgraph", "dev", "--config", "/app/backend/langgraph.json", "--host", "0.0.0.0", "--port", "22024", "--no-reload"]
    ports:
      - "${LANGGRAPH_HOST_PORT:-22024}:22024"
    restart: unless-stopped
    depends_on:
      - api
