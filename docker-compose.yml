services:
  api:
    build: .
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/teamhome
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: teamhome
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    restart: unless-stopped
    ports:
      - "5432:5432"

  langgraph:
    build: .
    env_file:
      - backend/.env
    command: ["langgraph", "dev", "--config", "/app/backend/langgraph.json", "--host", "0.0.0.0", "--port", "22024", "--no-reload"]
    ports:
      - "22024:22024"
    restart: unless-stopped
    depends_on:
      - api
