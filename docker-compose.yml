services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:admin@db:5432/teamhome
      JWT_SECRET: dev-secret-change-me
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: teamhome
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
